
spring.application.name=AI_Powered_Interview_Preparation_Assistant

server.port=8082

# Ollama Chat Model
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:0.6b
spring.ai.ollama.chat.options.temperature=0.2

# Ollama Embedding Model
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# PostgreSQL - Docker PGVector
spring.datasource.url=jdbc:postgresql://localhost:5432/interview_assistant
spring.datasource.username=postgres
spring.datasource.password=Ritesh@1234



# ==========================================
# Spring AI - PGVector Store Configuration
# ==========================================
# Set dimensions to 768 to match Ollama's embedding models (e.g., nomic-embed-text)
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=vector_store